name: Web

on:
  push:
    branches: ["**"]
    paths: ["web/**", "tools/emoji/**", "server/**", "docs/protocol.md", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_connect_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            web
            web/text
      - name: Install pinned Web tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-tools"
          curl -fLsS https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/trunk.tar.gz"
          printf '2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  %s\n' "$RUNNER_TEMP/trunk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/web-tools"
          curl -fLsS https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/wasm-pack.tar.gz"
          printf '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  %s\n' "$RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/web-tools"
          echo "$RUNNER_TEMP/web-tools" >> "$GITHUB_PATH"
          google-chrome --version
      - name: Check generated data and translations
        run: |
          python3 tools/emoji/make_search.py --check
          python3 web/i18n/generate.py . --check
      - name: Format and lint
        run: |
          cargo fmt --manifest-path web/Cargo.toml --all -- --check
          cargo clippy --manifest-path web/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Shared rules
        run: cargo test --manifest-path web/text/Cargo.toml
      - name: Build server and Web
        run: |
          cargo build --manifest-path server/Cargo.toml --locked
          cd web
          trunk build --release
      - name: Local server and WebSocket proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fc-web-e2e/attachments
          cat > "$RUNNER_TEMP/server.toml" <<'EOF'
          [server]
          bind = "127.0.0.1:58080"
          [database]
          host = "127.0.0.1"
          port = 5432
          user = "postgres"
          password = "postgres"
          database = "family_connect_web_e2e"
          [storage]
          attachments_dir = "/tmp/fc-web-e2e/attachments"
          key_file = "/tmp/fc-web-e2e/storage.key"
          [calls]
          enabled = false
          stun_urls = []
          EOF
          server/target/debug/family-connect storage-key new /tmp/fc-web-e2e/storage.key
          server/target/debug/family-connect --config "$RUNNER_TEMP/server.toml" > "$RUNNER_TEMP/server.log" 2>&1 &
          cat > "$RUNNER_TEMP/Trunk.toml" <<EOF
          [build]
          target = "$GITHUB_WORKSPACE/web/index.html"
          dist = "$GITHUB_WORKSPACE/web/dist"
          release = true
          [serve]
          addresses = ["127.0.0.1"]
          port = 58081
          no_autoreload = true
          [[proxy]]
          backend = "ws://127.0.0.1:58080/api/v1/ws"
          ws = true
          [[proxy]]
          backend = "http://127.0.0.1:58080/api/v1/"
          EOF
          trunk serve --config "$RUNNER_TEMP/Trunk.toml" > "$RUNNER_TEMP/web.log" 2>&1 &
          for readiness_attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:58081/api/v1/healthz; then exit 0; fi
            echo "Waiting for Web readiness ($readiness_attempt/90)"
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/web.log"
          exit 1
      - name: Two-account reaction search e2e
        run: python3 web/e2e/run-reaction-search.py --url http://127.0.0.1:58081 --output "$RUNNER_TEMP/web-e2e" --video
      - name: Browser suite
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          wasm-pack test --headless --chrome 2>&1 | tee "$RUNNER_TEMP/browser-tests.log"
      - name: Evidence and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-evidence
          path: |
            ${{ runner.temp }}/web-e2e
            ${{ runner.temp }}/browser-tests.log
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          if-no-files-found: warn
          retention-days: 14
